name: Build DSK LOCKER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_DIR"

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SDKMANAGER=$(find "$SDK_DIR" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_SDKMANAGER" ]; then
              SDKMANAGER="$FOUND_SDKMANAGER"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android cmdline-tools not found in $SDK_DIR; downloading official command-line tools..."
            CMDLINE_ZIP="/tmp/commandlinetools.zip"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o "$CMDLINE_ZIP"
            mkdir -p "$SDK_DIR/cmdline-tools/tmp"
            unzip -q -o "$CMDLINE_ZIP" -d "$SDK_DIR/cmdline-tools/tmp"
            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv "$SDK_DIR/cmdline-tools/tmp/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
            rm -rf "$SDK_DIR/cmdline-tools/tmp" "$CMDLINE_ZIP"
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          chmod +x "$SDKMANAGER"
          SDKMANAGER_BIN_DIR="$(dirname "$SDKMANAGER")"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_BIN_DIR" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          echo "Using sdkmanager at: $SDKMANAGER"
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment & Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit tests & build app-debug.apk
        shell: bash
        run: |
          set -euo pipefail
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK was not generated or is empty at: $APK_PATH"
            find app/build/outputs -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload DSK-Locker-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSK-Locker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
