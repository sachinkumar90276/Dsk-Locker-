name: Build DSK LOCKER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-backend:
    name: Verify Node.js Backend Build & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies & build backend
        run: npm ci --include=dev && npm run build

      - name: Run backend integration tests
        run: npm test

  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        shell: bash
        run: |
          set -eo pipefail

          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            echo "ERROR: Preinstalled Android SDK directory not found at: $SDK_DIR"
            exit 1
          fi

          SDKMANAGER=""
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -maxdepth 4 -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
            if [ -n "$FOUND_SDKMANAGER" ] && [ -x "$FOUND_SDKMANAGER" ]; then
              SDKMANAGER="$FOUND_SDKMANAGER"
            elif command -v sdkmanager >/dev/null 2>&1; then
              SDKMANAGER="$(command -v sdkmanager)"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_DIR/cmdline-tools or PATH."
            exit 1
          fi

          SDKMANAGER_BIN_DIR="$(dirname "$SDKMANAGER")"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDKMANAGER_BIN_DIR" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          echo "Using preinstalled Android SDK at: $SDK_DIR"
          "$SDKMANAGER" --version
          if [ ! -d "$SDK_DIR/platforms/android-36.1" ] || [ ! -d "$SDK_DIR/platforms/android-36" ] || [ ! -d "$SDK_DIR/build-tools/36.0.0" ] || [ ! -d "$SDK_DIR/platform-tools" ]; then
            if [ -w "$SDK_DIR" ]; then
              { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null
              "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
                "platform-tools" \
                "platforms;android-36.1" \
                "platforms;android-36" \
                "build-tools;36.0.0"
            else
              echo "WARNING: $SDK_DIR is not writable; using preinstalled SDK packages only."
            fi
          else
            echo "Required Android SDK platforms and build-tools are already installed."
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare environment & Android debug keystore
        shell: bash
        env:
          CI_BACKEND_API_URL: ${{ secrets.BACKEND_API_URL || vars.BACKEND_API_URL }}
          CI_DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -n "${CI_BACKEND_API_URL:-}" ]; then
            if grep -q '^BACKEND_API_URL=' .env 2>/dev/null; then
              sed -i "s|^BACKEND_API_URL=.*|BACKEND_API_URL=${CI_BACKEND_API_URL}|" .env
            else
              echo "BACKEND_API_URL=${CI_BACKEND_API_URL}" >> .env
            fi
          fi
          if [ -n "${CI_DEBUG_KEYSTORE_B64:-}" ]; then
            printf '%s' "$CI_DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
              echo "Restored debug.keystore from repository debug.keystore.base64."
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
              echo "Generated fresh debug.keystore."
            fi
          fi
          DEBUG_SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA1:/ {gsub(/:/, "", $2); print tolower($2); exit}')
          echo "DEBUG_KEYSTORE_SHA1=$DEBUG_SHA1" >> "$GITHUB_ENV"
          echo "Active debug keystore SHA-1 configured."

      - name: Configure & Verify Firebase google-services.json
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON_RAW: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import binascii
          import json
          import os
          import pathlib
          import sys

          target = pathlib.Path("app/google-services.json")
          raw = os.environ.get("GOOGLE_SERVICES_JSON_RAW", "").lstrip("\ufeff").strip()
          b64 = os.environ.get("GOOGLE_SERVICES_JSON_B64", "").strip()

          if raw:
              target.write_text(raw + "\n", encoding="utf-8")
              print("Populated app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          elif b64:
              try:
                  decoded = base64.b64decode("".join(b64.split()), validate=True)
              except binascii.Error as exc:
                  print(f"ERROR: GOOGLE_SERVICES_JSON_BASE64 is not valid base64: {exc}", file=sys.stderr)
                  sys.exit(1)
              target.write_bytes(decoded)
              print("Populated app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret.")
          elif target.is_file() and target.stat().st_size > 0:
              print("Using existing app/google-services.json from repository.")
          else:
              print(
                  "WARNING: app/google-services.json is not configured for Android package 'com.aistudio.dsklocker.vxqtzm'.\n"
                  "Checked in order:\n"
                  "  1. GitHub Secret GOOGLE_SERVICES_JSON -> not configured\n"
                  "  2. GitHub Secret GOOGLE_SERVICES_JSON_BASE64 -> not configured\n"
                  "  3. Committed app/google-services.json -> missing or empty\n"
                  "Continuing build in local/offline APK mode without Firebase credentials.\n"
                  "To enable Firebase Auth (Google Sign-In, Email/Password, Phone OTP), App Check, and Cloud Backup, "
                  "add GitHub Secret GOOGLE_SERVICES_JSON / GOOGLE_SERVICES_JSON_BASE64 or commit app/google-services.json.",
                  file=sys.stderr,
              )
              sys.exit(0)

          try:
              data = json.loads(target.read_text(encoding="utf-8").lstrip("\ufeff"))
          except Exception as exc:
              print(f"ERROR: app/google-services.json is not valid JSON: {exc}", file=sys.stderr)
              sys.exit(1)

          if data.get("type") == "service_account" or "private_key" in data:
              print(
                  "ERROR: app/google-services.json appears to be a Firebase Admin service account key. "
                  "Never place service account credentials in app/google-services.json; use the Android client google-services.json.",
                  file=sys.stderr,
              )
              sys.exit(1)

          project_info = data.get("project_info") or {}
          project_id = str(project_info.get("project_id", "")).strip()
          project_number = str(project_info.get("project_number", "")).strip()
          if not project_id or not project_number or project_id in {"remixed-project-id", "your-project-id", "example"}:
              print("ERROR: app/google-services.json has a missing or placeholder project_info.", file=sys.stderr)
              sys.exit(1)

          expected_pkg = "com.aistudio.dsklocker.vxqtzm"
          clients = data.get("client")
          if not isinstance(clients, list) or not clients:
              print("ERROR: app/google-services.json contains no client entries.", file=sys.stderr)
              sys.exit(1)

          matched_client = None
          for client in clients:
              pkg = client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              if pkg == expected_pkg:
                  matched_client = client
                  break

          if matched_client is None:
              print(
                  f"ERROR: app/google-services.json does not contain a client entry for package '{expected_pkg}'.",
                  file=sys.stderr,
              )
              sys.exit(1)

          mobilesdk_app_id = str(matched_client.get("client_info", {}).get("mobilesdk_app_id", "")).strip()
          api_keys = matched_client.get("api_key") or []
          has_api_key = any(str(k.get("current_key", "")).strip() for k in api_keys if isinstance(k, dict))
          if not mobilesdk_app_id or not has_api_key:
              print(
                  f"ERROR: app/google-services.json entry for '{expected_pkg}' is missing mobilesdk_app_id or api_key.",
                  file=sys.stderr,
              )
              sys.exit(1)

          oauth_clients = matched_client.get("oauth_client") or []
          web_clients = [c for c in oauth_clients if c.get("client_type") == 3 and str(c.get("client_id", "")).strip()]
          if not web_clients:
              print(
                  "ERROR: app/google-services.json is missing a Web OAuth client (client_type: 3) for "
                  f"'{expected_pkg}'. The Google Services plugin cannot generate R.string.default_web_client_id without it. "
                  "Enable Google Sign-In in Firebase Authentication and re-download google-services.json.",
                  file=sys.stderr,
              )
              sys.exit(1)

          android_hashes = [
              str(c.get("android_info", {}).get("certificate_hash", "")).replace(":", "").strip().lower()
              for c in oauth_clients
              if c.get("client_type") == 1
          ]
          active_sha1 = os.environ.get("DEBUG_KEYSTORE_SHA1", "").strip().lower()
          if active_sha1 and android_hashes and active_sha1 not in android_hashes:
              print(
                  "WARNING: Active debug.keystore SHA-1 is not listed in app/google-services.json Android OAuth clients. "
                  "APK compilation will succeed, but Google Sign-In at runtime requires registering this SHA-1 in Firebase Console.",
                  file=sys.stderr,
              )
          elif not android_hashes:
              print(
                  "WARNING: No Android OAuth client (client_type: 1) found in app/google-services.json. "
                  "Register your debug SHA-1 in Firebase Console for Google Sign-In.",
                  file=sys.stderr,
              )

          print(
              f"Verified Firebase config: project_id={project_id}, package={expected_pkg}, "
              f"web_oauth_clients={len(web_clients)}, android_oauth_clients={len(android_hashes)}"
          )
          PY

      - name: Run Android Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          elif [ -f ./gradlew ]; then
            bash ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Build Android Debug APK
        shell: bash
        run: |
          set -euo pipefail
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          elif [ -f ./gradlew ]; then
            bash ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Expected APK was not generated or is empty at: $APK_PATH"
            find app/build/outputs -maxdepth 4 -type f 2>/dev/null || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload DSK-Locker-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSK-Locker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build Signed Android Release APK (Optional)
        id: build_release
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_B64:-}" ] || [ -z "${STORE_PASSWORD:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
            echo "Release signing secrets not configured; skipping signed Release APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > "$KEYSTORE_PATH"
          if [ -x ./gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
          elif [ -f ./gradlew ]; then
            bash ./gradlew :app:assembleRelease --no-daemon --stacktrace
          else
            gradle :app:assembleRelease --no-daemon --stacktrace
          fi
          RELEASE_APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$RELEASE_APK" ]; then
            echo "ERROR: Expected release APK was not generated at: $RELEASE_APK"
            exit 1
          fi
          ls -lh "$RELEASE_APK"
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Upload DSK-Locker-Release-APK Artifact (Optional)
        if: steps.build_release.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DSK-Locker-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
