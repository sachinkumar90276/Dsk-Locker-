name: Build DSK LOCKER Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Set up Node.js (for optional SQL backend verification)
        if: hashFiles('backend/package.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify optional backend TypeScript build
        if: hashFiles('backend/package.json') != ''
        working-directory: backend
        run: |
          npm install
          npm run build

      - name: Prepare environment & Android debug keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit tests & build app-debug.apk
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon

      - name: Verify APK output exists
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: $APK_PATH was not generated!"
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload DSK-Locker-APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSK-Locker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
